# Compila KIKU Print en la nube y lo publica en el propio deploy del
# dashboard. Pipeline completo sin tocar ninguna PC:
#
#   push que toque kiku-print/  →  este workflow compila el .exe de Windows
#   →  lo commitea en public/descargas/  →  Vercel lo sirve
#   →  el KikuPrint.exe del local se auto-actualiza (chequea al arrancar
#      y cada 6 horas).
#
# Descarga manual: https://kiku-sushi-dashboard.vercel.app/descargas/KikuPrint.exe
name: kiku-print

on:
  push:
    branches: [master]
    paths:
      - 'kiku-print/**'
      - '.github/workflows/kiku-print.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: kiku-print/go.sum

      - name: Compilar KikuPrint.exe (Windows amd64)
        working-directory: kiku-print
        run: |
          go mod tidy
          go vet ./...
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o KikuPrint.exe .
          ls -la KikuPrint.exe

      - name: Publicar en public/descargas (lo sirve Vercel)
        run: |
          VERSION=$(grep -oP 'const version = "\K[^"]+' kiku-print/main.go)
          echo "Versión: $VERSION"
          mkdir -p public/descargas
          cp kiku-print/KikuPrint.exe public/descargas/KikuPrint.exe
          printf '{"version":"%s","url":"https://kiku-sushi-dashboard.vercel.app/descargas/KikuPrint.exe"}\n' "$VERSION" \
            > public/descargas/kiku-print-version.json
          git config user.name  "kiku-print-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/descargas kiku-print/go.sum kiku-print/go.mod
          git diff --cached --quiet && { echo "Sin cambios."; exit 0; }
          git commit -m "kiku-print: build v$VERSION [skip ci]"
          git push

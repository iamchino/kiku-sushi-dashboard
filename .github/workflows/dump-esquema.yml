# Extrae el esquema completo de la base de producción y lo commitea en
# provision/esquema_base.sql. Es la pieza que faltaba para instalar el sistema
# en un cliente nuevo: las migraciones del repo asumen que las tablas base ya
# existen (nacieron después del esquema original).
#
# Se corre a mano: GitHub → Actions → "dump-esquema" → Run workflow.
# Requiere el secret DATABASE_URL (Settings → Secrets and variables → Actions):
# la connection string de Supabase (Database → Connect → URI, la "direct").
name: dump-esquema

on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Dump del esquema (público, sin owners)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret DATABASE_URL (Settings → Secrets → Actions)."
            exit 1
          fi
          mkdir -p provision
          docker run --rm postgres:17-alpine \
            pg_dump "$DATABASE_URL" --schema-only --schema=public --no-owner \
            > provision/esquema_base.sql
          lineas=$(wc -l < provision/esquema_base.sql)
          echo "Esquema: $lineas líneas"
          if [ "$lineas" -lt 500 ]; then
            echo "::error::El dump salió sospechosamente chico ($lineas líneas)."
            exit 1
          fi

      - name: Dump de datos de catálogo (permisos, tipos, configs)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Datos que un cliente nuevo necesita para que el sistema funcione:
          # la matriz de permisos afinada, tipos de comprobante y las filas de
          # configuración (el cliente después las edita desde el dashboard).
          # NO se incluyen: webhook_config (tokens), facturacion_config (CUIT
          # del cliente, se carga en el onboarding), ni datos operativos.
          docker run --rm postgres:17-alpine \
            pg_dump "$DATABASE_URL" --data-only --column-inserts --no-owner \
              --table=public.roles \
              --table=public.recursos \
              --table=public.rol_permisos \
              --table=public.recurso_tablas \
              --table=public.tipos_comprobante \
              --table=public.web_config \
              --table=public.reservas_config \
              --table=public.reservas_dias \
              --table=public.envio_config \
              --table=public.impresion_config \
            > provision/datos_catalogo.sql
          echo "Catálogo: $(wc -l < provision/datos_catalogo.sql) líneas"

      - name: Limpiar para el SQL Editor
        run: |
          # Los metacomandos de psql (\restrict, etc.) no existen en el SQL
          # Editor de Supabase, y CREATE SCHEMA public choca con el existente.
          for f in provision/esquema_base.sql provision/datos_catalogo.sql; do
            sed -i '/^\\/d' "$f"
            sed -i 's/^CREATE SCHEMA public;/CREATE SCHEMA IF NOT EXISTS public;/' "$f"
          done

      - name: Commitear
        run: |
          git config user.name  "provision-bot"
          git config user.email "bot@users.noreply.github.com"
          git add provision/esquema_base.sql provision/datos_catalogo.sql
          git diff --cached --quiet && { echo "Sin cambios."; exit 0; }
          git commit -m "provision: esquema y catálogo desde producción [skip ci]"
          git push
